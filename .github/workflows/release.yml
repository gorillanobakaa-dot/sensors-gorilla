name: release
on:
  push:
    tags: ["v*"]
jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and SHA-256 verify PawnIO 0.2.12 modules (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\fetch_pawnio_modules.ps1
      - run: cargo test --release --offline --locked

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and SHA-256 verify PawnIO 0.2.12 modules
        shell: pwsh
        run: .\scripts\fetch_pawnio_modules.ps1
      - run: cargo build --release --offline --locked --target x86_64-pc-windows-msvc
      - name: Build Inno Setup click-to-install installers (with 256px Gorilla icon)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command ISCC.exe).Source }
          & $iscc installer\sensors-gorilla-generic.iss
          & $iscc installer\sensors-gorilla-l15.iss
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\sensors-gorilla.exe dist\
          Copy-Item target\x86_64-pc-windows-msvc\release\sensors-gorilla-l15.exe dist\
          Copy-Item installer\output\*installer.exe dist\
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add x86_64-unknown-linux-musl
      - run: cargo build --release --offline --locked --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/x86_64-unknown-linux-musl/release/sensors-gorilla
            target/x86_64-unknown-linux-musl/release/thermal-profile-daemon

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - run: cargo build --release --offline --locked --target x86_64-apple-darwin
      - run: cargo build --release --offline --locked --target aarch64-apple-darwin
      - name: Create universal binary, .icns icon (up to 1024px), and sensors.gorilla.app bundle
        run: |
          mkdir -p dist AppIcon.iconset
          lipo -create -output dist/sensors-gorilla-macos-universal \
            target/x86_64-apple-darwin/release/sensors-gorilla \
            target/aarch64-apple-darwin/release/sensors-gorilla
          cp target/x86_64-apple-darwin/release/sensors-gorilla dist/sensors-gorilla-macos-x86_64
          sips -z 16 16     assets/icons/sensors-gorilla-256.png  --out AppIcon.iconset/icon_16x16.png >/dev/null
          sips -z 32 32     assets/icons/sensors-gorilla-256.png  --out AppIcon.iconset/icon_16x16@2x.png >/dev/null
          sips -z 32 32     assets/icons/sensors-gorilla-256.png  --out AppIcon.iconset/icon_32x32.png >/dev/null
          sips -z 64 64     assets/icons/sensors-gorilla-256.png  --out AppIcon.iconset/icon_32x32@2x.png >/dev/null
          sips -z 128 128   assets/icons/sensors-gorilla-256.png  --out AppIcon.iconset/icon_128x128.png >/dev/null
          cp assets/icons/sensors-gorilla-256.png                      AppIcon.iconset/icon_128x128@2x.png
          cp assets/icons/sensors-gorilla-256.png                      AppIcon.iconset/icon_256x256.png
          cp assets/icons/sensors-gorilla-512.png                      AppIcon.iconset/icon_256x256@2x.png
          cp assets/icons/sensors-gorilla-512.png                      AppIcon.iconset/icon_512x512.png
          cp assets/icons/sensors-gorilla-1024.png                     AppIcon.iconset/icon_512x512@2x.png
          iconutil -c icns AppIcon.iconset -o dist/sensors-gorilla.icns
          mkdir -p "dist/sensors.gorilla.app/Contents/MacOS" "dist/sensors.gorilla.app/Contents/Resources"
          cp dist/sensors-gorilla-macos-universal "dist/sensors.gorilla.app/Contents/MacOS/sensors-gorilla"
          cp dist/sensors-gorilla.icns "dist/sensors.gorilla.app/Contents/Resources/AppIcon.icns"
          cp assets/macos/Info.plist "dist/sensors.gorilla.app/Contents/Info.plist"
          (cd dist && zip -r sensors-gorilla-macos-app.zip sensors.gorilla.app)
          rm -rf dist/sensors.gorilla.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  publish:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify version matches tag and release page exists
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != Cargo.toml $v"; exit 1; }
          test -s "releases/notes/$GITHUB_REF_NAME/page.md" || { echo "releases/notes/$GITHUB_REF_NAME/page.md missing"; exit 1; }
      - uses: actions/download-artifact@v4
      - name: Assemble all OS release assets and SHA256SUMS
        run: |
          mkdir out
          cp windows/sensors-gorilla.exe out/sensors-gorilla-windows-generic-x86_64.exe
          cp windows/sensors-gorilla-l15.exe out/sensors-gorilla-windows-thinkpad-l15-x86_64.exe
          cp windows/*installer.exe out/
          cp linux/sensors-gorilla out/sensors-gorilla-linux-x86_64
          cp linux/thermal-profile-daemon out/thermal-profile-daemon-linux-x86_64
          cp macos/sensors-gorilla-macos-x86_64 out/sensors-gorilla-macos-x86_64
          cp macos/sensors-gorilla-macos-universal out/sensors-gorilla-macos-universal
          cp macos/sensors-gorilla-macos-app.zip out/sensors-gorilla-macos-app.zip
          cp assets/icons/sensors-gorilla-512.png out/sensors-gorilla-512.png
          cp recreate_success.sh out/recreate_success.sh
          cp thermal-profile-daemon.README.md out/thermal-profile-daemon.README.md
          chmod +x out/sensors-gorilla-linux-x86_64 out/thermal-profile-daemon-linux-x86_64 out/sensors-gorilla-macos-x86_64 out/sensors-gorilla-macos-universal out/recreate_success.sh
          cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS
          python3 - <<'PY'
          import os, pathlib, re
          page_p = pathlib.Path(f"../releases/notes/{os.environ['GITHUB_REF_NAME']}/page.md")
          text = page_p.read_text(encoding="utf-8")
          rows = []
          for line in pathlib.Path("SHA256SUMS").read_text().splitlines():
              sha, name = line.split(None, 1)
              sz = pathlib.Path(name).stat().st_size
              rows.append(f"| `{name}` | {sz:,} | `{sha}` |")
          table = "| File | Bytes | SHA-256 |\n|---|---|---|\n" + "\n".join(rows)
          new_text = re.sub(r"\| File \| Bytes \| SHA-256 \|\n\|---\|---\|---\|\n\|[^\n]*\|", table, text, count=1)
          pathlib.Path("../release_page.md").write_text(new_text, encoding="utf-8")
          PY
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "sensors.gorilla $GITHUB_REF_NAME" --notes-file release_page.md
