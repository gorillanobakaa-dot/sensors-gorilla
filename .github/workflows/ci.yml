name: ci
on:
  push:
  pull_request:
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Fetch and SHA-256 verify PawnIO 0.2.12 modules (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\fetch_pawnio_modules.ps1
      - name: Run unit tests
        run: cargo test --release --offline --locked
      - name: Build release binaries (zero on-the-fly compilation)
        run: cargo build --release --offline --locked --target ${{ matrix.target }}
      - name: Verify macOS .icns generation (16..1024px)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          mkdir -p AppIcon.iconset
          sips -z 16 16     assets/icons/sensors-gorilla-256.png  --out AppIcon.iconset/icon_16x16.png >/dev/null
          sips -z 32 32     assets/icons/sensors-gorilla-256.png  --out AppIcon.iconset/icon_16x16@2x.png >/dev/null
          sips -z 32 32     assets/icons/sensors-gorilla-256.png  --out AppIcon.iconset/icon_32x32.png >/dev/null
          sips -z 64 64     assets/icons/sensors-gorilla-256.png  --out AppIcon.iconset/icon_32x32@2x.png >/dev/null
          sips -z 128 128   assets/icons/sensors-gorilla-256.png  --out AppIcon.iconset/icon_128x128.png >/dev/null
          cp assets/icons/sensors-gorilla-256.png                      AppIcon.iconset/icon_128x128@2x.png
          cp assets/icons/sensors-gorilla-256.png                      AppIcon.iconset/icon_256x256.png
          cp assets/icons/sensors-gorilla-512.png                      AppIcon.iconset/icon_256x256@2x.png
          cp assets/icons/sensors-gorilla-512.png                      AppIcon.iconset/icon_512x512.png
          cp assets/icons/sensors-gorilla-1024.png                     AppIcon.iconset/icon_512x512@2x.png
          iconutil -c icns AppIcon.iconset -o AppIcon.icns
      - name: Smoke-test native binaries
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/sensors-gorilla"
          [ "${{ runner.os }}" = "Windows" ] && BIN="${BIN}.exe"
          "$BIN" --version
          "$BIN" --once >/dev/null
          "$BIN" --json >/dev/null
          if [ "${{ runner.os }}" = "Windows" ]; then
            "target/${{ matrix.target }}/release/sensors-gorilla-l15.exe" --version
            "target/${{ matrix.target }}/release/sensors-gorilla-l15.exe" --once --no-ec >/dev/null
            "target/${{ matrix.target }}/release/sensors-gorilla-l15.exe" --json --no-ec >/dev/null
          fi
          if [ "${{ runner.os }}" = "Linux" ]; then
            "target/${{ matrix.target }}/release/thermal-profile-daemon" --version
            bash -n recreate_success.sh
          fi
